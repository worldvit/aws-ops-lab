# 과정 파일 — 과정마다 이 파일만 새로 만든다. 모듈·스크립트에는 과정 값을 넣지 않는다.
# 수강생은 ~/opslab-env.sh 에 export COURSE=skons-eks 가 있어야 이 파일을 쓴다(Day 0 안내).
id: skons-eks
customer: SK오앤에스
audience: SK오앤에스 신입사원(직원) 직무교육
parent_course: 「AWS 운영 역량 강화 과정」 2단계 EKS 운영(64H, 8일)
prev_stage: skons
next_stage: 3단계 종합평가와 런북(16H, 2일)
account_provider: 메가존클라우드
notion_root: SK오앤스
instructor_domain: adfontes.cloud
instructor_account_id: TBD        # Day 0에 확정
budget_daily: 15
budget_total: 150
# EKS — Day 0에 표준 지원 버전으로 확정 (2026-11 리허설: 1.37 / 1.36)
eks_version: "1.37"
eks_version_prev: "1.36"
node_instance_type: m6i.large     # 파드 보안 그룹(podnet-6) 지원 유형. 서울 4개 AZ 제공 확인
node_count: 2
# 미러 레지스트리(강사 ECR Public). tools/mirror-images.sh 가 images 를 같은 태그로 복사한다.
registry: public.ecr.aws/x4d0l7d9/opslab   # 리허설 계정(6762) 미러 — Day 0에 강사 계정 값으로 바꾼다
images:
  app: opslab-app:1.1.0           # 저장소 app/ 에서 빌드(tools/mirror-images.sh build) — 1.1.0: /ready·/health/deep·APP_WARMUP_SEC·APP_BUILD
  postgres: pgvector/pgvector:pg16
  redis: library/redis:7.4-alpine
  busybox: library/busybox:1.37
  headlamp: ghcr.io/headlamp-k8s/headlamp:v0.46.0
  lbc: public.ecr.aws/eks/aws-load-balancer-controller:v3.6.3   # AWS Load Balancer Controller (vendor/charts 3.6.3)
  vault: hashicorp/vault:2.0.4    # Vault 서버(금고) — vendor/charts/vault 0.34.1
  vault-k8s: hashicorp/vault-k8s:1.7.6   # Vault Agent Injector(사이드카 주입기)
  argocd: quay.io/argoproj/argocd:v3.4.4   # Argo CD(GitOps 감시원) — vendor/charts/argo-cd 9.7.1
  argocd-redis: library/redis:8.2.3-alpine # Argo CD 내부 캐시(차트 9.7.1 기본 태그)
  python: library/python:3.12-slim         # 샘플 앱 기본 이미지 — image 모듈 파이프라인이 미러에서 받아 빌드한다
  argo-rollouts: quay.io/argoproj/argo-rollouts:v1.10.2   # Argo Rollouts(카나리 배포) — vendor/charts/argo-rollouts 2.43.12
  python-old: library/python:3.12.0-slim-bookworm   # 취약점이 많은 옛 기본 이미지(image-3) — 2026-11 측정 CRITICAL 17 (정상 3.12-slim 은 CRITICAL 0·HIGH 3). Day 0 에 다시 측정
# GitOps — 수강생 Fork(~/opslab-env.sh 의 GITHUB_REPO=<내 ID>/aws-ops-lab)의 그날 브랜치 opslab/<모듈>-<날짜> 를 이 태그에서 만든다
upstream_repo: worldvit/aws-ops-lab
gitops_base_tag: eks-v1
days:
  1: workload
  2: cluster
  3: podnet
  4: access
  5: gitops
  6: image
  7: heal
  8: scale
override: {}
