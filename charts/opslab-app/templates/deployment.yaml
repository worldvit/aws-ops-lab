{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout                      # Argo Rollouts — 카나리(일부에게 먼저) 배포. 파드 정의는 Deployment 와 같다
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "opslab-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.rollout.enabled }}
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: {{ .Values.rollout.canaryWeight }}       # 새 버전 파드를 일부만 띄워 손님 일부에게 먼저
        - pause: { duration: {{ .Values.rollout.pauseSeconds }}s }
        {{- if .Values.rollout.analysis.enabled }}
        - analysis: { templates: [{ templateName: {{ .Release.Name }}-canary }] }   # 지표로 판정 — 실패하면 자동 중단(abort)·되돌림
        {{- end }}
        - setWeight: 100
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  {{- end }}
  selector:
    matchLabels: {{- include "opslab-app.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "opslab-app.labels" . | nindent 8 }}
      {{- if or .Values.podAnnotations (eq .Values.db.source "vault") }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if eq .Values.db.source "vault" }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.db.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-db-cred.env: {{ .Values.db.vault.path | quote }}
        vault.hashicorp.com/agent-inject-template-db-cred.env: {{ .Values.db.vault.template | quote }}
        vault.hashicorp.com/secret-volume-path-db-cred.env: /etc/app
        vault.hashicorp.com/agent-pre-populate: "true"
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.waitForDb.enabled }}
      initContainers:
        - name: wait-db
          image: {{ .Values.waitForDb.image }}
          command: ["sh", "-c", "until nc -z -w 2 $DB_HOST $DB_PORT; do echo waiting for $DB_HOST:$DB_PORT; sleep 2; done; echo $DB_HOST:$DB_PORT is up"]
          env:
            - { name: DB_HOST, value: {{ .Values.db.host | quote }} }
            - { name: DB_PORT, value: {{ .Values.db.port | quote }} }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 32Mi } }
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          {{- if .Values.config.data }}
          envFrom:
            - configMapRef: { name: {{ .Values.config.name | default (printf "%s-config" .Release.Name) }} }
          {{- end }}
          env:
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            - { name: DB_HOST, value: {{ .Values.db.host | quote }} }
            - { name: DB_PORT, value: {{ .Values.db.port | quote }} }
            - { name: DB_NAME, value: {{ .Values.db.name | quote }} }
            - { name: DB_USER, value: {{ .Values.db.user | quote }} }
            {{- if eq .Values.db.source "secret" }}
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.db.secretName }}, key: password } }
            {{- end }}
            - { name: REDIS_HOST, value: {{ .Values.redis.host | quote }} }
            - { name: REDIS_PORT, value: {{ .Values.redis.port | quote }} }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.probes.startup.path }}          {{/* path 를 비우면 그 probe 를 쓰지 않는다 */}}
          startupProbe:
            httpGet: { path: {{ .Values.probes.startup.path }}, port: http }
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet: { path: {{ .Values.probes.liveness.path }}, port: http }
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- if .Values.probes.readiness.path }}
          readinessProbe:
            httpGet: { path: {{ .Values.probes.readiness.path }}, port: http }
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.dataVolume.enabled }}
          volumeMounts: [{ name: data, mountPath: {{ .Values.env.APP_DATA_DIR }} }]
          {{- end }}
      {{- if .Values.dataVolume.enabled }}
      volumes: [{ name: data, emptyDir: {} }]
      {{- end }}
