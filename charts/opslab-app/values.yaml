# Ops Lab 샘플 앱 기본값. 모듈은 --set 또는 values 파일로 필요한 것만 바꾼다.
image:
  repository: public.ecr.aws/x4d0l7d9/opslab/opslab-app   # start.sh 가 과정 파일 registry 로 채운다
  tag: "1.0.0"
  pullPolicy: IfNotPresent
replicaCount: 2

# 앱 동작(환경변수). 장애 변형은 이 값들을 바꾼다 — app/app.py 첫머리 설명 참고
env:
  APP_VERSION: v1
  APP_ERROR_RATE: "0"              # /api 가 500 을 돌려줄 확률(0~1). 장애 변형이 바꾼다
  APP_MEM_MB: "50"                 # 시작할 때 잡는 메모리(MB). 평소 사용량 약 100MiB
  APP_DATA_DIR: /opt/app/data      # 시작 표식 파일을 쓰는 곳
  APP_DB_CHECK_ON_START: "1"       # 시작할 때 DB 접속 확인(실패하면 종료)

# DB·캐시 주소 — 같은 네임스페이스의 opslab-data 차트가 만든 서비스. <후속 단계>에서 Aurora 주소로 바꿀 수 있다
db:
  host: postgres
  port: "5432"
  name: opslab
  user: app
  source: secret                   # secret: 쿠버네티스 Secret(opslab-db) / vault: Vault Agent 주입(K4 층이 있는 날) / none: DB 를 쓰지 않음(gitops 의 dev 환경)
  secretName: opslab-db
  # source: vault 일 때 — Vault Agent(사이드카)가 아래 경로의 비밀을 /etc/app/db-cred.env 파일로 써 준다(앱은 요청마다 이 파일을 읽는다)
  vault:
    role: opslab-app               # Vault Kubernetes Auth 역할 이름
    path: secret/data/opslab/db    # KV v2 비밀 경로
    template: |
      {{- with secret "secret/data/opslab/db" -}}
      DB_USER={{ .Data.data.user }}
      DB_PASSWORD={{ .Data.data.password }}
      {{- end }}
redis:
  host: redis
  port: "6379"

# DB가 뜰 때까지 기다리는 init 컨테이너
waitForDb:
  enabled: true
  image: public.ecr.aws/docker/library/busybox:1.37

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }

# 파드 건강검진
probes:
  startup:   { path: /health, periodSeconds: 2, timeoutSeconds: 2, failureThreshold: 30 }   # 최대 60초까지 출근 준비를 기다려 준다
  liveness:  { path: /health, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
  readiness: { path: /health, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 2 }

securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
# 읽기 전용 루트 파일시스템을 쓸 때 APP_DATA_DIR 에 빈 디렉터리(emptyDir)를 붙인다
dataVolume:
  enabled: false

serviceAccount:
  name: opslab-app
  annotations: {}                  # IRSA: eks.amazonaws.com/role-arn

podAnnotations: {}
nodeSelector: {}
tolerations: []
topologySpreadConstraints: []

service:
  port: 80

ingress:
  enabled: false
  annotations: {}
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  cpuUtilization: 60
pdb:                               # 점검(드레인) 중에도 최소 몇 개는 남겨 두라는 약속
  enabled: false
  minAvailable: 1                  # 또는 maxUnavailable(한 번에 몇 개까지 내려가도 되나)
  maxUnavailable: ""

# Argo Rollouts 카나리 배포(heal 모듈) — enabled 면 Deployment 대신 Rollout 을 만든다(클러스터에 Argo Rollouts 가 있어야 함)
rollout:
  enabled: false
  canaryWeight: 50                 # 새 버전 비중(%). 파드 2개면 1개가 새 버전
  pauseSeconds: 60                 # 지켜보는 시간
  analysis:                        # CloudWatch(ALB 지표)로 판정하는 분석 — 실패하면 자동 중단
    enabled: true
    initialDelay: 60s              # ALB 지표가 CloudWatch 에 들어오기까지 기다림
    interval: 60s
    count: 3                       # 3번 잰다
    failureLimit: 1                # 실패 1번까지 봐준다(2번이면 중단)
    okMetric: HTTPCode_Target_2XX_Count   # 정상 응답 수 지표 — 오류율 = 1 - 정상/전체
    maxErrorRate: "0.05"           # 오류율 5% 이하
    maxLatency: "0.5"              # 평균 응답시간 0.5초 이하

# 앱 설정(ConfigMap) — data 가 있으면 ConfigMap 을 만들고 앱이 환경변수로 읽는다(envFrom).
# wave 는 Argo CD 적용 순서(sync-wave): 숫자가 작을수록 먼저 만든다. 앱(Deployment)은 0 이므로 설정은 -1 이어야 한다.
config:
  name: ""                         # 비우면 <릴리스>-config
  wave: "-1"
  data: {}

# 배포 전 점검(Argo CD PreSync 훅) — 배포하기 전에 DB 에 접속되는지 확인하는 Job. 실패하면 배포(Sync)를 멈춘다.
precheck:
  enabled: false
  host: ""                         # 비우면 db.host
