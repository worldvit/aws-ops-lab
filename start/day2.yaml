AWSTemplateFormatVersion: "2010-09-09"
Description: >
  [시작 템플릿] Day 2 시작 상태 = Day 1 완료 상태(정상, 재발 방지 알람 포함)를 한 스택으로 만든다.
  스택 이름: <학번>-d2-start. 리소스 이름은 Day 1 그대로(<학번>-d1-*) 써서 Day 1 스크립트를 다시 쓸 수 있다.
  Day 1 1단계를 시간 안에 끝내지 못했을 때 따라잡기용으로도 쓴다.
  Day 0 스택(권한 경계)이 먼저 있어야 한다. 배포 시 --tags Course=opslab Day=2 Owner=<학번> 을 붙인다.

Parameters:
  StudentId:
    Type: String
    AllowedPattern: "s[0-9]{2}"
    Description: 학번 (예 s01)
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-vpc" }]

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-igw" }]
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }

  PubA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-pub-a" }]
  PubC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-pub-c" }]
  AppA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-app-a" }]
  AppC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-app-c" }]

  PubRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-pub-rt" }]
  PubDefault:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref PubRt, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  PubAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PubA, RouteTableId: !Ref PubRt }
  PubCAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PubC, RouteTableId: !Ref PubRt }

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttach
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-nat-eip" }]
  Nat:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PubA
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-nat" }]

  AppRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-app-rt" }]
  AppDefault:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref AppRt, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref Nat }
  AppAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppA, RouteTableId: !Ref AppRt }
  AppCAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppC, RouteTableId: !Ref AppRt }

  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-d1-ec2-role"
      # Day 0 권한 경계: 수강생이 만드는 역할은 경계를 달아야만 만들어진다
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
  Ec2Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${StudentId}-d1-ec2-profile"
      Roles: [!Ref Ec2Role]

  LoadgenSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${StudentId}-d1-loadgen-sg"
      GroupDescription: loadgen - egress only
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-loadgen-sg" }]
  Loadgen:
    Type: AWS::EC2::Instance
    DependsOn: AppDefault
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.micro
      SubnetId: !Ref AppA
      IamInstanceProfile: !Ref Ec2Profile
      SecurityGroupIds: [!Ref LoadgenSg]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-loadgen" }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          dnf install -y git jq tmux
          git clone https://github.com/worldvit/aws-ops-lab /opt/opslab || true
          chmod -R a+rX /opt/opslab

  # ── Day 1 학습 대상(보안 그룹·시작 템플릿·타깃 그룹·ALB·ASG·확장 정책)
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${StudentId}-d1-alb-sg"
      GroupDescription: ALB - HTTP from internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-alb-sg" }]

  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${StudentId}-d1-app-sg"
      GroupDescription: App - 8080 from ALB only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSg }
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-app-sg" }]

  Lt:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${StudentId}-d1-lt"
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: t3.micro
        IamInstanceProfile: { Name: !Ref Ec2Profile }
        SecurityGroupIds: [!Ref AppSg]
        MetadataOptions: { HttpTokens: required }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub "${StudentId}-d1-app" }
              - { Key: Course, Value: opslab }
              - { Key: Day, Value: "1" }
              - { Key: Owner, Value: !Ref StudentId }
        UserData:
          Fn::Base64: |
            #!/bin/bash
            curl -fsSL https://raw.githubusercontent.com/worldvit/aws-ops-lab/main/app/install.sh | bash

  Tg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${StudentId}-d1-tg"
      Protocol: HTTP
      Port: 8080
      TargetType: instance
      VpcId: !Ref Vpc
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${StudentId}-d1-alb"
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSg]
      Subnets: [!Ref PubA, !Ref PubC]

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref Tg }]

  Asg:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: Listener
    Properties:
      AutoScalingGroupName: !Sub "${StudentId}-d1-asg"
      MinSize: "2"
      MaxSize: "4"
      DesiredCapacity: "2"
      LaunchTemplate:
        LaunchTemplateId: !Ref Lt
        Version: !GetAtt Lt.LatestVersionNumber
      VPCZoneIdentifier: [!Ref AppA, !Ref AppC]
      TargetGroupARNs: [!Ref Tg]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 180
      MetricsCollection: [{ Granularity: 1Minute }]
      Tags:
        - { Key: Name, Value: !Sub "${StudentId}-d1-app", PropagateAtLaunch: true }

  ReqPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${StudentId}-d1-req-tt"
      AutoScalingGroupName: !Ref Asg
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        TargetValue: 1000
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join ["/", [!GetAtt Alb.LoadBalancerFullName, !GetAtt Tg.TargetGroupFullName]]

  # ── Day 1 재발 방지 알람 (Lab 1-1·1-3·1-4 개선 단계에서 만든 것과 같음)
  UnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StudentId}-d1-unhealthy-hosts"
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Statistic: Maximum
      Dimensions:
        - { Name: TargetGroup, Value: !GetAtt Tg.TargetGroupFullName }
        - { Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
  Elb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StudentId}-d1-elb-5xx"
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Statistic: Sum
      Dimensions: [{ Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }]
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StudentId}-d1-target-5xx"
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Statistic: Sum
      Dimensions: [{ Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }]
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  AtMaxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StudentId}-d1-asg-at-max"
      EvaluationPeriods: 5
      Threshold: 0
      ComparisonOperator: LessThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: d
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/AutoScaling, MetricName: GroupDesiredCapacity, Dimensions: [{ Name: AutoScalingGroupName, Value: !Ref Asg }] }
            Period: 60
            Stat: Maximum
        - Id: x
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/AutoScaling, MetricName: GroupMaxSize, Dimensions: [{ Name: AutoScalingGroupName, Value: !Ref Asg }] }
            Period: 60
            Stat: Maximum
        - { Id: gap, Expression: "x - d", Label: room-to-scale, ReturnData: true }

Outputs:
  AlbDns:    { Value: !GetAtt Alb.DNSName }
  AlbArn:    { Value: !Ref Alb }
  TgArn:     { Value: !Ref Tg }
  AlbSg:     { Value: !Ref AlbSg }
  AppSg:     { Value: !Ref AppSg }
  VpcId:     { Value: !Ref Vpc }
  LoadgenId: { Value: !Ref Loadgen }
