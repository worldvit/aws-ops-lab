AWSTemplateFormatVersion: "2010-09-09"
Description: >
  [환경 층 L1 — 네트워크 기반] VPC, 서브넷 4개(퍼블릭 2·프라이빗 2), IGW, NAT Gateway 1개,
  EC2 역할(권한 경계 지정), 부하 전용 EC2. 스택 이름: <학번>-l1 (common/start.sh 가 배포).
  L0 층(권한 경계)이 먼저 있어야 한다.

Parameters:
  StudentId:
    Type: String
    AllowedPattern: "s[0-9]{2}"
    Description: 학번 (예 s01)
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-base-vpc" }]

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-base-igw" }]
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }

  PubA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-base-pub-a" }]
  PubC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-base-pub-c" }]
  AppA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-base-app-a" }]
  AppC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-base-app-c" }]

  PubRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-base-pub-rt" }]
  PubDefault:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref PubRt, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  PubAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PubA, RouteTableId: !Ref PubRt }
  PubCAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PubC, RouteTableId: !Ref PubRt }

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttach
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-base-nat-eip" }]
  Nat:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PubA
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-base-nat" }]

  AppRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-base-app-rt" }]
  AppDefault:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref AppRt, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref Nat }
  AppAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppA, RouteTableId: !Ref AppRt }
  AppCAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref AppC, RouteTableId: !Ref AppRt }

  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-base-ec2-role"
      # L0 권한 경계: 수강생이 만드는 역할은 경계를 달아야만 만들어진다
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
  Ec2Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${StudentId}-base-ec2-profile"
      Roles: [!Ref Ec2Role]

  LoadgenSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${StudentId}-base-loadgen-sg"
      GroupDescription: loadgen - egress only
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-base-loadgen-sg" }]
  Loadgen:
    Type: AWS::EC2::Instance
    DependsOn: AppDefault
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.micro
      SubnetId: !Ref AppA
      IamInstanceProfile: !Ref Ec2Profile
      SecurityGroupIds: [!Ref LoadgenSg]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-base-loadgen" }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          dnf install -y git jq tmux postgresql15 python3-pip
          pip3 install --quiet psycopg2-binary==2.9.9
          git clone https://github.com/worldvit/aws-ops-lab /opt/opslab || true
          chmod -R a+rX /opt/opslab

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${StudentId}-base-VpcId" }
  PublicSubnets:
    Value: !Join [",", [!Ref PubA, !Ref PubC]]
    Export: { Name: !Sub "${StudentId}-base-PublicSubnets" }
  AppSubnets:
    Value: !Join [",", [!Ref AppA, !Ref AppC]]
    Export: { Name: !Sub "${StudentId}-base-AppSubnets" }
  Ec2Profile:
    Value: !Ref Ec2Profile
    Export: { Name: !Sub "${StudentId}-base-Ec2Profile" }
  LoadgenId:
    Value: !Ref Loadgen
  AppRouteTable:
    Value: !Ref AppRt
    Export: { Name: !Sub "${StudentId}-base-AppRt" }
  PubRouteTable:
    Value: !Ref PubRt
    Export: { Name: !Sub "${StudentId}-base-PubRt" }
  NatId:
    Value: !Ref Nat
    Export: { Name: !Sub "${StudentId}-base-NatId" }
