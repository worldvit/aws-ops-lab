AWSTemplateFormatVersion: "2010-09-09"
Description: >
  [환경 층 L2 — 앱 계층] cmp 모듈 완료 상태(정상, 재발 방지 알람 포함):
  보안 그룹·시작 템플릿·타깃 그룹·ALB·ASG·확장 정책·알람. 리소스 이름은 cmp 모듈과 같다(<학번>-cmp-*).
  스택 이름: <학번>-l2 (common/start.sh 가 배포). L1 층이 먼저 있어야 한다.

Parameters:
  StudentId:
    Type: String
    AllowedPattern: "s[0-9]{2}"
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  # ── cmp 모듈 완료 상태(보안 그룹·시작 템플릿·타깃 그룹·ALB·ASG·확장 정책)
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${StudentId}-cmp-alb-sg"
      GroupDescription: ALB - HTTP from internet
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-base-VpcId" }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-cmp-alb-sg" }]

  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${StudentId}-cmp-app-sg"
      GroupDescription: App - 8080 from ALB only
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-base-VpcId" }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSg }
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-cmp-app-sg" }]

  Lt:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${StudentId}-cmp-lt"
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: t3.micro
        IamInstanceProfile: { Name: { "Fn::ImportValue": !Sub "${StudentId}-base-Ec2Profile" } }
        SecurityGroupIds: [!Ref AppSg]
        MetadataOptions: { HttpTokens: required }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub "${StudentId}-cmp-app" }
              - { Key: Course, Value: opslab }
              - { Key: Module, Value: cmp }
              - { Key: Owner, Value: !Ref StudentId }
        UserData:
          Fn::Base64: |
            #!/bin/bash
            curl -fsSL https://raw.githubusercontent.com/worldvit/aws-ops-lab/main/app/install.sh | bash

  Tg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${StudentId}-cmp-tg"
      Protocol: HTTP
      Port: 8080
      TargetType: instance
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-base-VpcId" }
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${StudentId}-cmp-alb"
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSg]
      Subnets: !Split [",", { "Fn::ImportValue": !Sub "${StudentId}-base-PublicSubnets" }]

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref Tg }]

  Asg:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: Listener
    Properties:
      AutoScalingGroupName: !Sub "${StudentId}-cmp-asg"
      MinSize: "2"
      MaxSize: "4"
      DesiredCapacity: "2"
      LaunchTemplate:
        LaunchTemplateId: !Ref Lt
        Version: !GetAtt Lt.LatestVersionNumber
      VPCZoneIdentifier: !Split [",", { "Fn::ImportValue": !Sub "${StudentId}-base-AppSubnets" }]
      TargetGroupARNs: [!Ref Tg]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 180
      MetricsCollection: [{ Granularity: 1Minute }]
      Tags:
        - { Key: Name, Value: !Sub "${StudentId}-cmp-app", PropagateAtLaunch: true }

  ReqPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${StudentId}-cmp-req-tt"
      AutoScalingGroupName: !Ref Asg
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        TargetValue: 1000
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join ["/", [!GetAtt Alb.LoadBalancerFullName, !GetAtt Tg.TargetGroupFullName]]

  # ── cmp 모듈 재발 방지 알람 (cmp-1·cmp-3·cmp-4 개선 단계에서 만든 것과 같음)
  UnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StudentId}-cmp-unhealthy-hosts"
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Statistic: Maximum
      Dimensions:
        - { Name: TargetGroup, Value: !GetAtt Tg.TargetGroupFullName }
        - { Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
  Elb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StudentId}-cmp-elb-5xx"
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Statistic: Sum
      Dimensions: [{ Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }]
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StudentId}-cmp-target-5xx"
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Statistic: Sum
      Dimensions: [{ Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }]
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  AtMaxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StudentId}-cmp-asg-at-max"
      EvaluationPeriods: 5
      Threshold: 0
      ComparisonOperator: LessThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: d
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/AutoScaling, MetricName: GroupDesiredCapacity, Dimensions: [{ Name: AutoScalingGroupName, Value: !Ref Asg }] }
            Period: 60
            Stat: Maximum
        - Id: x
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/AutoScaling, MetricName: GroupMaxSize, Dimensions: [{ Name: AutoScalingGroupName, Value: !Ref Asg }] }
            Period: 60
            Stat: Maximum
        - { Id: gap, Expression: "x - d", Label: room-to-scale, ReturnData: true }

Outputs:
  AlbDns: { Value: !GetAtt Alb.DNSName }
  AlbArn: { Value: !Ref Alb }
  ListenerArn:
    Value: !Ref Listener
    Export: { Name: !Sub "${StudentId}-cmp-ListenerArn" }
  TgArn:  { Value: !Ref Tg }
  AlbSg:  { Value: !Ref AlbSg }
  AppSg:
    Value: !Ref AppSg
    Export: { Name: !Sub "${StudentId}-cmp-AppSg" }
