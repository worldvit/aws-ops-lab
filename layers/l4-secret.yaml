AWSTemplateFormatVersion: "2010-09-09"
Description: >
  [환경 층 L4 — 시크릿 계층] sec 모듈 완료 상태(정상): KMS 키, Secrets Manager 비밀(앱의 외부 연동 키),
  앱 역할의 비밀 읽기 권한, Vault 서버(EC2 단일 노드, 파일 스토리지). Vault 초기화·잠금 해제·엔진 설정과
  앱 서버의 Vault Agent 설치는 layers/l4-secret.init.sh 가 한다(common/start.sh 가 배포 뒤 자동 실행).
  스택 이름: <학번>-l4. L1·L2·L3 층이 먼저 있어야 한다.

Parameters:
  StudentId:
    Type: String
    AllowedPattern: "s[0-9]{2}"
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  # KMS 키 — 키 정책은 "관리" 문장과 "사용" 문장을 나눈다.
  #  · Admin: 계정(root)에 관리 작업만 허용 → 정책을 잘못 고쳐도 키를 잃지 않는다(잠김 방지)
  #  · AccountUseViaSecretsManager: 계정의 사용자(수강생)가 Secrets Manager 를 거쳐서만 키를 쓰게 한다
  #  · AppUse: 앱 역할(<학번>-base-ec2-role)의 복호화 — 앱은 이 문장으로만 키를 쓴다(sec-5 실습 대상)
  Key:
    Type: AWS::KMS::Key
    Properties:
      Description: opslab sec - Secrets Manager key
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Id: opslab-sec-key
        Statement:
          - Sid: Admin
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: [kms:Create*, kms:Describe*, kms:Enable*, kms:List*, kms:Put*, kms:Update*, kms:Revoke*, kms:Disable*,
                     kms:Get*, kms:Delete*, kms:TagResource, kms:UntagResource, kms:ScheduleKeyDeletion, kms:CancelKeyDeletion,
                     kms:RotateKeyOnDemand]
            Resource: "*"
          - Sid: AccountUseViaSecretsManager
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey*, kms:ReEncrypt*, kms:DescribeKey]
            Resource: "*"
            Condition:
              StringEquals: { "kms:ViaService": !Sub "secretsmanager.${AWS::Region}.amazonaws.com" }
          - Sid: AppUse
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:role/${StudentId}-base-ec2-role" }
            Action: [kms:Decrypt, kms:DescribeKey]
            Resource: "*"
  KeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${StudentId}-sec-key"
      TargetKeyId: !Ref Key

  # 앱의 외부 연동 키(예: 파트너 API 키) — 앱의 /secret 이 읽는다
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${StudentId}/sec/app"
      Description: partner API key used by the sample app (/secret)
      KmsKeyId: !Ref Key
      GenerateSecretString:
        SecretStringTemplate: '{"partner":"opslab-partner"}'
        GenerateStringKey: api_key
        PasswordLength: 32
        ExcludePunctuation: true

  # 앱 역할에 비밀 읽기 권한(인라인 정책) — KMS 권한은 키 정책(AppUse)이 준다 (sec-6 실습 대상)
  AppAccess:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: !Sub "${StudentId}-base-ec2-role"
      PolicyName: !Sub "${StudentId}-sec-app-access"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadAppSecret
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref AppSecret

  VaultSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${StudentId}-sec-vault-sg"
      GroupDescription: Vault API 8200 from base VPC
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-base-VpcId" }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8200, ToPort: 8200, CidrIp: 10.0.0.0/16 }
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-sec-vault-sg" }]

  # Vault 서버 — 단일 노드, 파일 스토리지(/opt/vault/data). 개발 모드가 아니므로 재시작하면 잠긴다(sealed).
  Vault:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.small
      SubnetId: !Select [0, !Split [",", { "Fn::ImportValue": !Sub "${StudentId}-base-AppSubnets" }]]
      IamInstanceProfile: { "Fn::ImportValue": !Sub "${StudentId}-base-Ec2Profile" }
      SecurityGroupIds: [!Ref VaultSg]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-sec-vault" }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          curl -fsSL https://raw.githubusercontent.com/worldvit/aws-ops-lab/main/app/vault-server.sh | bash

Outputs:
  VaultAddr:
    Value: !Sub "http://${Vault.PrivateIp}:8200"
  VaultInstanceId:
    Value: !Ref Vault
  KmsKeyId:
    Value: !Ref Key
  AppSecretArn:
    Value: !Ref AppSecret
