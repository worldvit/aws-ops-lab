AWSTemplateFormatVersion: "2010-09-09"
Description: >
  [환경 층 L0 — 보호 장치, Day 0에 1회] Ops Lab 기본 보호 장치.
  강사 읽기 전용 역할, FIS 실험 역할, Budgets 알람, 하위 도메인 호스팅 영역, 권한 경계 정책을 만든다.
  배포가 끝나면 Outputs 의 NextStep 명령으로 내 IAM 사용자에 권한 경계를 붙인다(되돌릴 수 없음).
  스택 이름은 반드시 <학번>-l0 으로 한다(권한 경계가 이 이름의 스택을 보호한다).

Parameters:
  StudentId:
    Type: String
    AllowedPattern: "s[0-9]{2}"
    Description: 학번 (예 s01)
  InstructorAccountId:
    Type: String
    AllowedPattern: "[0-9]{12}"
    Description: 강사 AWS 계정 ID (강사가 알려 줌)
  StudentEmail:
    Type: String
    Description: 비용 알람을 받을 수강생 이메일
  InstructorEmail:
    Type: String
    Description: 비용 알람을 받을 강사 이메일
  InstructorDomain:
    Type: String
    Default: adfontes.cloud
    Description: 강사 도메인. 수강생 하위 도메인 <학번>.<강사 도메인> 의 호스팅 영역을 만든다
  ProviderRolePattern:
    Type: String
    Default: OrganizationAccountAccessRole
    Description: 계정 제공사 관리용 IAM 역할 이름(와일드카드 * 가능). 강사가 Day 0에 확인해 알려 줌

Conditions:
  # 같은 주소를 두 번 넣으면 Budgets가 거부하므로, 같으면 한 번만 넣는다
  SameEmail: !Equals [!Ref StudentEmail, !Ref InstructorEmail]

Resources:
  # ── 강사 읽기 전용 역할: 강사는 확인만 하고 변경하지 않는다
  InstructorReadOnly:
    Type: AWS::IAM::Role
    Properties:
      RoleName: opslab-instructor-readonly
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${InstructorAccountId}:root" }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess

  # ── FIS 실험 역할: 모든 모듈의 FIS 장애에 필요한 권한을 미리 모두 넣는다
  FisRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: opslab-fis
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: fis.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSFaultInjectionSimulatorEC2Access
        - arn:aws:iam::aws:policy/service-role/AWSFaultInjectionSimulatorNetworkAccess
        - arn:aws:iam::aws:policy/service-role/AWSFaultInjectionSimulatorRDSAccess
        - arn:aws:iam::aws:policy/service-role/AWSFaultInjectionSimulatorSSMAccess
        - arn:aws:iam::aws:policy/service-role/AWSFaultInjectionSimulatorECSAccess

  # ── 비용 알람: 일 $10, 누적(연간) $100 을 넘으면 수강생·강사에게 메일
  DailyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "opslab-${StudentId}-daily"
        BudgetType: COST
        TimeUnit: DAILY
        BudgetLimit: { Amount: 10, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: !If
            - SameEmail
            - [{ SubscriptionType: EMAIL, Address: !Ref StudentEmail }]
            - [{ SubscriptionType: EMAIL, Address: !Ref StudentEmail }, { SubscriptionType: EMAIL, Address: !Ref InstructorEmail }]
  TotalBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "opslab-${StudentId}-total"
        BudgetType: COST
        TimeUnit: ANNUALLY
        BudgetLimit: { Amount: 100, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: !If
            - SameEmail
            - [{ SubscriptionType: EMAIL, Address: !Ref StudentEmail }]
            - [{ SubscriptionType: EMAIL, Address: !Ref StudentEmail }, { SubscriptionType: EMAIL, Address: !Ref InstructorEmail }]

  # ── 수강생 하위 도메인: 매일 지우면 이름 서버가 바뀌므로 과정 내내 유지한다
  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Sub "${StudentId}.${InstructorDomain}"
      HostedZoneConfig: { Comment: Ops Lab student subdomain (Day 0) }

  # ── 권한 경계: "관리자 권한에서 보호 대상에 대한 작업만 뺀" 울타리
  Boundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: opslab-student-boundary
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEverythingElse
            Effect: Allow
            Action: "*"
            Resource: "*"
          # 울타리 자체를 고치거나 떼지 못한다
          - Sid: DenyBoundaryPolicyChange
            Effect: Deny
            Action: [iam:CreatePolicyVersion, iam:SetDefaultPolicyVersion, iam:DeletePolicyVersion, iam:DeletePolicy]
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
          - Sid: DenyBoundaryRemoval
            Effect: Deny
            Action: [iam:DeleteUserPermissionsBoundary, iam:DeleteRolePermissionsBoundary]
            Resource: "*"
          - Sid: DenyBoundarySwap
            Effect: Deny
            Action: [iam:PutUserPermissionsBoundary, iam:PutRolePermissionsBoundary]
            Resource: "*"
            Condition:
              StringNotEquals: { "iam:PermissionsBoundary": !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary" }
          # 새 사용자·역할은 같은 울타리를 달아야만 만들어진다 (서비스 연결 역할은 CreateServiceLinkedRole 이라 해당 없음)
          - Sid: DenyCreateWithoutBoundary
            Effect: Deny
            Action: [iam:CreateUser, iam:CreateRole]
            Resource: "*"
            Condition:
              StringNotEquals: { "iam:PermissionsBoundary": !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary" }
          # 보호 대상 역할: 강사 읽기 전용, FIS, 계정 제공사 관리용
          - Sid: ProtectRoles
            Effect: Deny
            Action:
              - iam:DeleteRole
              - iam:UpdateRole
              - iam:UpdateRoleDescription
              - iam:UpdateAssumeRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:PutRolePermissionsBoundary
              - iam:TagRole
              - iam:UntagRole
            Resource:
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/opslab-instructor-readonly"
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/opslab-fis"
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProviderRolePattern}"
          # L0 스택 자체를 지우거나 고치지 못한다
          - Sid: ProtectL0Stack
            Effect: Deny
            Action:
              - cloudformation:DeleteStack
              - cloudformation:UpdateStack
              - cloudformation:CreateChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:SetStackPolicy
              - cloudformation:UpdateTerminationProtection
            Resource: !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/${StudentId}-l0/*"
          - Sid: ProtectHostedZone
            Effect: Deny
            Action: route53:DeleteHostedZone
            Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZone.Id}"
          - Sid: ProtectCloudTrail
            Effect: Deny
            Action: [cloudtrail:StopLogging, cloudtrail:DeleteTrail, cloudtrail:UpdateTrail, cloudtrail:PutEventSelectors]
            Resource: "*"
          - Sid: ProtectBudgets
            Effect: Deny
            Action: [budgets:ModifyBudget, budgets:DeleteBudgetAction, budgets:UpdateBudgetAction]
            Resource: "*"

Outputs:
  NameServers:
    Description: 강사에게 전달할 이름 서버 4개 (강사가 강사 도메인에 NS 레코드로 등록)
    Value: !Join [",", !GetAtt HostedZone.NameServers]
  BoundaryArn:
    Value: !Ref Boundary
  NextStep:
    Description: 마지막 단계 — 내 IAM 사용자에 권한 경계 붙이기 (CloudShell)
    Value: !Sub >-
      aws iam put-user-permissions-boundary --user-name $(aws sts get-caller-identity --query Arn --output text | cut -d/ -f2)
      --permissions-boundary ${Boundary}
