# scale-2 재발 방지로 확인할 항목 — common/review.sh 가 읽는다.
lab: scale-2
checks:
- name: Karpenter NodePool·EC2NodeClass 가 기준 상태(한도 16·크기 large·xlarge·서브넷 태그)이고 Ready 다
  run: bash ~/opslab/modules/scale/state.sh karpenter
  fix: kubectl edit nodepool default / ec2nodeclass default 로 기준값을 되돌리거나 sed … karpenter-nodes.yaml | kubectl apply -f -
  ref: 해답 — 변형별 조치
- name: Pending 파드가 없다(배치 작업이 노드를 받았다)
  run: bash ~/opslab/modules/scale/state.sh pending
  fix: 고친 뒤 1~2분이면 Karpenter 가 노드를 만듭니다. kubectl get nodeclaim 과 kubectl -n kube-system logs deploy/karpenter 를 보세요
  ref: 해답 — 정상 확인
- name: 런북에 노드 미할당 확인 순서(Pending 이벤트 → nodeclaim → Karpenter 로그 → NodePool·EC2NodeClass)가 있다
  run: grep -qiE "nodeclaim|karpenter" ~/opslab-work/scale/runbook-scale-2.md && grep -qiE "nodepool|ec2nodeclass" ~/opslab-work/scale/runbook-scale-2.md
  fix: 런북 2. 확인 순서에 "Pending 파드 이벤트 → kubectl get nodeclaim → Karpenter 로그 → NodePool(한도·조건)·EC2NodeClass(서브넷·보안 그룹·Ready)"를 적으세요
  ref: 해답 — 런북 예시
