# scale-5 재발 방지로 확인할 항목 — common/review.sh 가 읽는다.
lab: scale-5
checks:
- name: PostgreSQL 이 Running 이고 기준 데이터가 있으며 노드 고정이 없다
  run: bash ~/opslab/modules/scale/state.sh db
  fix: ① 스냅샷 pg-baseline 에서 PVC 복원 ② StatefulSet 의 nodeSelector 를 지우고 파드 다시 만들기
  ref: 해답 요약
- name: 런북에 EBS 는 한 AZ 에 묶인다는 점과 스냅샷 복원 절차가 있다
  run: grep -qiE "스냅샷|snapshot" ~/opslab-work/scale/runbook-scale-5.md && grep -qiE "AZ|가용 영역" ~/opslab-work/scale/runbook-scale-5.md
  fix: 런북에 "EBS 볼륨은 만든 AZ 에서만 붙는다 / 디스크를 잃으면 VolumeSnapshot 에서 PVC 를 같은 이름으로 복원"을 적으세요
  ref: 해답 요약
