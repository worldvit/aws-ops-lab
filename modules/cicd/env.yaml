AWSTemplateFormatVersion: "2010-09-09"
Description: >
  [cicd 모듈 주변 구성] 스택 이름: <학번>-cicd-env (common/start.sh cicd 가 L1·L2 다음에 배포)
  학습 대상이 아닌 것만 미리 만든다: 서비스 역할(권한 경계 포함), 산출물 버킷, ECR 저장소,
  ECS 클러스터·서비스(부트스트랩 이미지, 배포 방식 CODE_DEPLOY), 블루/그린 타깃 그룹과 8000 리스너,
  카나리 배포 설정, 배포 중단용 알람. CodeBuild 프로젝트·CodeDeploy 앱/배포 그룹·파이프라인은 수강생이 직접 만든다.

Parameters:
  StudentId:
    Type: String
    AllowedPattern: "s[0-9]{2}"

Resources:
  # ── 산출물 버킷과 이미지 저장소
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${StudentId}-cicd-artifacts-${AWS::AccountId}"
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
  EcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${StudentId}-cicd-app"
      EmptyOnDelete: true
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  # ── 서비스 역할 (모두 권한 경계 opslab-student-boundary)
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-cicd-pipeline-role"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: codepipeline.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketVersioning, s3:ListBucket, s3:GetBucketLocation]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
              - Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${StudentId}-cicd-*"
              - Effect: Allow
                Action: [codedeploy:CreateDeployment, codedeploy:GetApplication, codedeploy:GetApplicationRevision,
                         codedeploy:GetDeployment, codedeploy:GetDeploymentConfig, codedeploy:RegisterApplicationRevision]
                Resource: "*"
              - Effect: Allow
                Action: [ecs:RegisterTaskDefinition, ecs:DescribeTaskDefinition, ecs:TagResource]
                Resource: "*"
              - Effect: Allow
                Action: [cloudformation:CreateChangeSet, cloudformation:DescribeChangeSet, cloudformation:ExecuteChangeSet,
                         cloudformation:DeleteChangeSet, cloudformation:DescribeStacks]
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StudentId}-cicd-release/*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt TaskExecRole.Arn, !GetAtt CfnRole.Arn]
        # 소스 연결 사용 권한은 따로 둔다 (자격증명 관리 실습)
        - PolicyName: source-connection
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [codestar-connections:UseConnection, codeconnections:UseConnection]
                Resource: "*"

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-cicd-build-role"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: codebuild.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${StudentId}-cicd-*"
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketLocation]
                Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]
        # 이미지 저장소 푸시 권한은 따로 둔다 (빌드 단계 장애 실습)
        - PolicyName: ecr-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Effect: Allow, Action: ecr:GetAuthorizationToken, Resource: "*" }
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload,
                         ecr:PutImage, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !GetAtt EcrRepo.Arn

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-cicd-deploy-role"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: codedeploy.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

  CfnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-cicd-cfn-role"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: cloudformation.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: release-params
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ssm:PutParameter, ssm:DeleteParameter, ssm:GetParameter, ssm:GetParameters, ssm:DescribeParameters,
                         ssm:AddTagsToResource, ssm:RemoveTagsFromResource, ssm:ListTagsForResource]
                Resource: "*"

  TaskExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-cicd-task-exec-role"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]

  # 앱 서버(EC2)의 CodeDeploy 에이전트가 산출물 버킷에서 배포 묶음을 받는다
  Ec2ArtifactRead:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${StudentId}-cicd-artifact-read"
      Roles: [!Sub "${StudentId}-base-ec2-role"]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [s3:GetObject, s3:GetObjectVersion, s3:ListBucket]
            Resource: [!GetAtt ArtifactBucket.Arn, !Sub "${ArtifactBucket.Arn}/*"]

  # ── ECS (Fargate) — 서비스는 CodeDeploy 가 배포한다(블루/그린)
  Cluster:
    Type: AWS::ECS::Cluster
    Properties: { ClusterName: !Sub "${StudentId}-cicd" }
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/opslab/${StudentId}/cicd-app", RetentionInDays: 1 }
  EcsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${StudentId}-cicd-ecs-sg"
      GroupDescription: ECS tasks - 8080 from ALB only
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-base-VpcId" }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: { "Fn::ImportValue": !Sub "${StudentId}-cmp-AlbSg" } }
  AlbIngress8000:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: { "Fn::ImportValue": !Sub "${StudentId}-cmp-AlbSg" }
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      CidrIp: 0.0.0.0/0
      Description: cicd ECS service (blue/green)
  TgBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${StudentId}-cicd-tg-blue"
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-base-VpcId" }
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes: [{ Key: deregistration_delay.timeout_seconds, Value: "10" }]
  TgGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${StudentId}-cicd-tg-green"
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-base-VpcId" }
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes: [{ Key: deregistration_delay.timeout_seconds, Value: "10" }]
  Listener8000:
    Type: AWS::ElasticLoadBalancingV2::Listener
    # CodeDeploy 가 배포 때마다 리스너를 블루↔그린으로 바꾼다 → 삭제 때 리스너를 먼저 지워야 그린 TG 삭제가 실패하지 않는다
    DependsOn: TgGreen
    Properties:
      LoadBalancerArn: { "Fn::ImportValue": !Sub "${StudentId}-cmp-AlbArn" }
      Port: 8000
      Protocol: HTTP
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TgBlue }]
  # 부트스트랩 작업 정의 — 첫 파이프라인 실행 전까지 /health 만 응답(공개 python 이미지). 이후 CodeDeploy 가 교체한다
  BootTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${StudentId}-cicd-app"
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: public.ecr.aws/docker/library/python:3.12-slim
          Essential: true
          Command: ["sh", "-c", "mkdir -p /w && echo ok > /w/health && echo '{\"version\":\"bootstrap\"}' > /w/api && cd /w && python -m http.server 8080"]
          PortMappings: [{ ContainerPort: 8080 }]
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: app }
  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener8000
    Properties:
      ServiceName: !Sub "${StudentId}-cicd-svc"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref BootTaskDef
      DesiredCount: 2
      LaunchType: FARGATE
      DeploymentController: { Type: CODE_DEPLOY }
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref EcsSg]
          Subnets: !Split [",", { "Fn::ImportValue": !Sub "${StudentId}-base-AppSubnets" }]
      LoadBalancers: [{ ContainerName: app, ContainerPort: 8080, TargetGroupArn: !Ref TgBlue }]

  # ── 카나리 배포 설정: 20% 로 3분 지켜본 뒤 나머지 80%
  Canary:
    Type: AWS::CodeDeploy::DeploymentConfig
    Properties:
      DeploymentConfigName: !Sub "${StudentId}-cicd-canary20-3m"
      ComputePlatform: ECS
      TrafficRoutingConfig:
        Type: TimeBasedCanary
        TimeBasedCanary: { CanaryPercentage: 20, CanaryInterval: 3 }

  # ── 배포 중단 기준 알람: ECS 서비스(블루+그린 타깃)의 5xx 가 1분에 3건 이상
  EcsTarget5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StudentId}-cicd-ecs-5xx"
      AlarmDescription: canary stop criterion - target 5xx of the ECS service (blue + green)
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: b
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions:
                - { Name: TargetGroup, Value: !GetAtt TgBlue.TargetGroupFullName }
                - Name: LoadBalancer
                  Value: !Select [1, !Split ["loadbalancer/", { "Fn::ImportValue": !Sub "${StudentId}-cmp-AlbArn" }]]
            Period: 60
            Stat: Sum
        - Id: g
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions:
                - { Name: TargetGroup, Value: !GetAtt TgGreen.TargetGroupFullName }
                - Name: LoadBalancer
                  Value: !Select [1, !Split ["loadbalancer/", { "Fn::ImportValue": !Sub "${StudentId}-cmp-AlbArn" }]]
            Period: 60
            Stat: Sum
        - { Id: e, Expression: "FILL(b,0) + FILL(g,0)", Label: ecs-target-5xx, ReturnData: true }

Outputs:
  CicdBucket: { Value: !Ref ArtifactBucket }
  EcrUri: { Value: !GetAtt EcrRepo.RepositoryUri }
  PipelineRoleArn: { Value: !GetAtt PipelineRole.Arn }
  BuildRoleArn: { Value: !GetAtt BuildRole.Arn }
  DeployRoleArn: { Value: !GetAtt DeployRole.Arn }
  CfnRoleArn: { Value: !GetAtt CfnRole.Arn }
  TaskExecRoleArn: { Value: !GetAtt TaskExecRole.Arn }
  EcsLogGroup: { Value: !Ref LogGroup }
  EcsListenerArn: { Value: !Ref Listener8000 }
