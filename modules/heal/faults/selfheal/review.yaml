# heal-4 재발 방지로 확인할 항목 — common/review.sh 가 읽는다.
lab: heal-4
checks:
- name: 운영 앱 자동 치유가 켜져 있고 Synced·Healthy 이다
  run: '[ "$(kubectl -n argocd get application opslab-prod -o jsonpath={.spec.syncPolicy.automated.selfHeal})" = true ] && [ "$(kubectl -n argocd get application opslab-prod -o jsonpath={.status.sync.status})" = Synced ]'
  fix: 긴급 조치는 Git 커밋(revert)으로 하세요. 자동 치유를 끄는 것은 답이 아닙니다
  ref: 해답
- name: 카나리 분석이 다시 켜져 있다
  run: bash ~/opslab/modules/heal/state.sh analysis
  fix: 'rollout.analysis.enabled: true 로 되돌리는 커밋을 푸시하세요'
  ref: 해답
- name: Rollout 이 Healthy 이다
  run: bash ~/opslab/modules/heal/state.sh rollout
  fix: kubectl argo rollouts get rollout opslab-app -n app
  ref: 해답 — 정상 확인
