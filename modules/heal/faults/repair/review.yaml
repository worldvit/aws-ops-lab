# heal-5 재발 방지로 확인할 항목 — common/review.sh 가 읽는다.
lab: heal-5
checks:
- name: 노드 자동 복구가 켜져 있고 교체 범위 제한이 있다
  run: bash ~/opslab/modules/heal/state.sh repair
  fix: aws eks update-nodegroup-config --cluster-name $SID-cluster-eks --nodegroup-name $SID-cluster-ng --node-repair-config '{"enabled":true,"maxUnhealthyNodeThresholdPercentage":50,"maxParallelNodesRepairedCount":1}'
  ref: 해답 요약
- name: 노드 3대 모두 Ready 이다
  run: bash ~/opslab/modules/heal/state.sh nodes
  fix: '멈춘 kubelet 을 다시 시작하거나(Session Manager: sudo systemctl start kubelet) 자동 복구가 교체할 때까지 기다리세요'
  ref: 해답 요약
