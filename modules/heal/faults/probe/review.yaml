# heal-1 재발 방지로 확인할 항목 — common/review.sh 가 읽는다.
lab: heal-1
checks:
- name: 건강검진 역할이 나뉘어 있다(startup 있음 · liveness /health · readiness /ready)
  run: bash ~/opslab/modules/heal/state.sh probes
  fix: 운영 값 probes 를 기준으로 되돌리는 커밋(git revert)을 푸시하세요. liveness 는 얕게(/health), 바깥 의존성(DB)은 liveness 에 넣지 않습니다
  ref: 해답 — 변형별 조치
- name: Rollout 이 Healthy 이고 앱 파드가 재시작을 되풀이하지 않는다
  run: bash ~/opslab/modules/heal/state.sh rollout
  fix: 고친 커밋이 카나리를 끝까지 통과했는지 kubectl argo rollouts get rollout opslab-app -n app 으로 확인하세요
  ref: 해답 — 정상 확인
- name: DB(postgres)가 다시 떠 있다
  run: '[ "$(kubectl -n app get sts postgres -o jsonpath={.status.readyReplicas})" = 1 ]'
  fix: kubectl -n app scale sts postgres --replicas=1 (DB 점검이 끝났으면)
  ref: 해답 — 변형 ① 조치
- name: 런북에 "liveness 는 바깥 의존성을 보지 않는다"는 재발 방지가 있다
  run: grep -qiE "liveness" ~/opslab-work/heal/runbook-heal-1.md && grep -qiE "readiness|startup" ~/opslab-work/heal/runbook-heal-1.md
  fix: 런북 5. 재발 방지에 startup·liveness·readiness 역할 구분(liveness 는 얕게, readiness 는 준비 상태, 느린 시작은 startup)을 적으세요
  ref: 해답 — 런북 예시
