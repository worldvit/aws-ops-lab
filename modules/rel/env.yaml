AWSTemplateFormatVersion: "2010-09-09"
# [rel 모듈 주변 구성] 오늘의 학습 대상이 아닌 구성: S3 교차 리전 복제 역할(권한 경계 지정).
# 버킷 이름 규칙: 원본 <학번>-rel-src-<계정ID>(서울), 복제본 <학번>-rel-dr-<계정ID>(도쿄) — 수강생이 1단계에서 직접 만든다.
# 스택 이름: <학번>-rel-env (common/start.sh rel 이 L1·L2·L3 다음에 배포).
Description: >-
  opslab rel - supporting stack <SID>-rel-env (deployed by common/start.sh rel): S3 cross-region replication role.

Parameters:
  StudentId:
    Type: String
    AllowedPattern: "s[0-9]{2}"

Resources:
  ReplRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-rel-repl-role"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: replication
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadSourceConfig
                Effect: Allow
                Action: [s3:GetReplicationConfiguration, s3:ListBucket]
                Resource: !Sub "arn:aws:s3:::${StudentId}-rel-src-${AWS::AccountId}"
              - Sid: ReadSourceObjects
                Effect: Allow
                Action: [s3:GetObjectVersionForReplication, s3:GetObjectVersionAcl, s3:GetObjectVersionTagging]
                Resource: !Sub "arn:aws:s3:::${StudentId}-rel-src-${AWS::AccountId}/*"
              - Sid: WriteReplica
                Effect: Allow
                Action: [s3:ReplicateObject, s3:ReplicateDelete, s3:ReplicateTags]
                Resource: !Sub "arn:aws:s3:::${StudentId}-rel-dr-${AWS::AccountId}/*"

Outputs:
  ReplRoleArn: { Value: !GetAtt ReplRole.Arn }
