# 모듈 정의 — 과정·Day와 무관하게 이 모듈만의 정보를 둔다.
id: rel
title: 복원력과 비용
hours: 8
requires: L3          # 아침에 배포할 환경 층 (common/start.sh rel → L1, L2, L3 + 주변 구성 env.yaml = <학번>-rel-env)
builds: —             # 층을 만들지 않음. 따라잡기(start.sh rel full)는 full.sh 가 1단계 명령을 실행
topics: 업무별 RTO · RPO 정의와 백업 복원 시간 실측 · S3 교차 리전 복제 검증 · AZ 장애 가정 복구 훈련 · 비용 급증 원인 추적 · 유휴 자원과 과대 배정 정리
# Lab 목록: Lab ID | 장애 디렉터리(faults/) | 변형 수 | 구분 | 장애 유형(수강생에게 보이는 문구)
labs:
  - rel-1 | crr     | 3 | 필수 | 서울 버킷에 올린 파일이 도쿄(재해 복구) 버킷에 복제되지 않는 장애
  - rel-2 | az      | 2 | 필수 | 한 가용 영역(AZ)이 끊긴 뒤 서비스 일부 또는 전부가 회복되지 않는 장애 (주입 3~6분, AZ 장애 15분 지속)
  - rel-3 | cost    | 3 | 필수 | 오늘 들어 시간당 비용이 갑자기 늘어난 장애(서비스는 정상)
  - rel-4 | backup  | 2 | 심화 | 데이터베이스 백업 설정이 정해 둔 RPO·보호 기준을 어긴 장애
