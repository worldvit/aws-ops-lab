AWSTemplateFormatVersion: "2010-09-09"
# [auto 모듈 주변 구성] 오늘의 학습 대상이 아닌 구성: 자동화 실행 역할, EventBridge 호출 역할(모두 권한 경계 지정),
# 운영 알림 SNS 주제, 예비(standby) 서버. 스택 이름: <학번>-auto-env (common/start.sh auto 가 L1·L2 다음에 배포).
Description: >-
  opslab auto - supporting stack <SID>-auto-env (deployed by common/start.sh auto): automation role, EventBridge role, ops SNS topic, standby server.

Parameters:
  StudentId:
    Type: String
    AllowedPattern: "s[0-9]{2}"
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  # ── SSM Automation 이 런북을 실행할 때 쓰는 역할(AutomationAssumeRole)
  AutomationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-auto-automation-role"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ssm.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: automation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: RunCommand
                Effect: Allow
                Action: [ssm:SendCommand, ssm:ListCommands, ssm:ListCommandInvocations, ssm:GetCommandInvocation, ssm:CancelCommand, ssm:DescribeInstanceInformation]
                Resource: "*"
              - Sid: FindTargets
                Effect: Allow
                Action: [ec2:DescribeInstances]
                Resource: "*"
              - Sid: SafetySwitch
                Effect: Allow
                Action: [ssm:GetParameter]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/opslab/auto/*"

  # ── EventBridge 규칙이 자동화를 시작할 때 쓰는 역할
  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-auto-events-role"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-automation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:StartAutomationExecution
                # 대상 ARN 은 automation-definition 이지만 권한 검사는 document·automation-execution ARN 으로도 한다 — 셋 다 필요
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${StudentId}-auto-*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/${StudentId}-auto-*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt AutomationRole.Arn

  # ── 운영 알림(자동 조치 실패 등) — 수강생이 1단계에서 메일 구독을 추가한다
  OpsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${StudentId}-auto-ops"
  OpsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref OpsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref OpsTopic

  # ── 예비 서버: 주 서비스(ALB)가 죽으면 DNS 가 이쪽으로 넘어온다(점검 중 안내용, 같은 앱 version=standby, :80)
  StandbySg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${StudentId}-auto-standby-sg"
      GroupDescription: standby - HTTP from internet
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-base-VpcId" }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-auto-standby-sg" }]
  Standby:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.micro
      SubnetId: !Select [0, !Split [",", { "Fn::ImportValue": !Sub "${StudentId}-base-PublicSubnets" }]]
      IamInstanceProfile: { "Fn::ImportValue": !Sub "${StudentId}-base-Ec2Profile" }
      SecurityGroupIds: [!Ref StandbySg]
      MetadataOptions: { HttpTokens: required }
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-auto-standby" }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          curl -fsSL https://raw.githubusercontent.com/worldvit/aws-ops-lab/main/app/install.sh | APP_PORT=80 APP_VERSION=standby bash

Outputs:
  AutomationRoleArn: { Value: !GetAtt AutomationRole.Arn }
  EventsRoleArn: { Value: !GetAtt EventsRole.Arn }
  OpsTopicArn: { Value: !Ref OpsTopic }
  StandbyIp: { Value: !GetAtt Standby.PublicIp }
  StandbyId: { Value: !Ref Standby }
