AWSTemplateFormatVersion: "2010-09-09"
# [net 모듈 주변 구성] 사내 서비스 VPC(인터넷 없음)와 내부 서비스 서버, SSM 관리용 인터페이스 엔드포인트,
# Flow Logs 전달 역할. 수강생이 직접 구축하는 것(TGW·라우팅·STS 엔드포인트·NACL·Network Firewall)은 넣지 않는다.
# 스택 이름: <학번>-net-env (common/start.sh net 이 L1·L2 다음에 배포).
Description: >-
  opslab net - supporting stack <SID>-net-env (deployed by common/start.sh net): internal service VPC and server, SSM endpoints, Flow Logs role.

Parameters:
  StudentId:
    Type: String
    AllowedPattern: "s[0-9]{2}"
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  NetVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-vpc" }]

  # 서브넷 3개(가용 영역 a): TGW 연결용 · 방화벽용 · 서비스용
  TgwSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NetVpc
      CidrBlock: 10.20.0.0/28
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-tgw-a" }]
  FwSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NetVpc
      CidrBlock: 10.20.1.0/28
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-fw-a" }]
  SvcSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NetVpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-svc-a" }]

  # 라우팅 테이블 3개 — 처음에는 local 경로만 있다(수강생이 TGW·방화벽 경로를 추가)
  TgwRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NetVpc
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-tgw-rt" }]
  TgwRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref TgwSubnet, RouteTableId: !Ref TgwRt }
  FwRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NetVpc
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-fw-rt" }]
  FwRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref FwSubnet, RouteTableId: !Ref FwRt }
  SvcRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NetVpc
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-svc-rt" }]
  SvcRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref SvcSubnet, RouteTableId: !Ref SvcRt }

  SvcSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${StudentId}-net-svc-sg"
      GroupDescription: internal service - 8080 from base VPC
      VpcId: !Ref NetVpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: 10.0.0.0/16 }
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-svc-sg" }]

  # SSM 관리용 엔드포인트(인터넷이 없는 VPC에서 Session Manager·Run Command를 쓰기 위함)
  MgmtVpceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${StudentId}-net-mgmt-vpce-sg"
      GroupDescription: SSM endpoints - 443 from net VPC
      VpcId: !Ref NetVpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 10.20.0.0/16 }
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-mgmt-vpce-sg" }]
  VpceSsm:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref NetVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SvcSubnet]
      SecurityGroupIds: [!Ref MgmtVpceSg]
  VpceSsmMessages:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref NetVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssmmessages"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SvcSubnet]
      SecurityGroupIds: [!Ref MgmtVpceSg]
  VpceEc2Messages:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref NetVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2messages"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SvcSubnet]
      SecurityGroupIds: [!Ref MgmtVpceSg]

  # 내부 서비스 서버 — 인터넷이 없으므로 패키지 설치 없이 python3 표준 라이브러리로 8080 응답
  Svc:
    Type: AWS::EC2::Instance
    DependsOn: [VpceSsm, VpceSsmMessages, VpceEc2Messages]
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.micro
      SubnetId: !Ref SvcSubnet
      PrivateIpAddress: 10.20.2.10
      IamInstanceProfile: { "Fn::ImportValue": !Sub "${StudentId}-base-Ec2Profile" }
      SecurityGroupIds: [!Ref SvcSg]
      MetadataOptions: { HttpTokens: required }
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-svc" }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          mkdir -p /opt/svc
          cat > /opt/svc/svc.py <<'PY'
          import json, socket, time
          from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
          HOST, START = socket.gethostname(), time.time()
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  path = self.path.split("?")[0]
                  if path in ("/health", "/api"):
                      body = {"status": "ok", "service": "internal-settlement", "host": HOST,
                              "uptime_sec": int(time.time() - START)}
                      code = 200
                  else:
                      body, code = {"status": "not_found"}, 404
                  data = json.dumps(body).encode()
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)
              def log_message(self, *a):
                  pass
          ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
          PY
          cat > /etc/systemd/system/svc.service <<'EOF'
          [Unit]
          Description=internal settlement service (opslab net)
          After=network-online.target
          [Service]
          ExecStart=/usr/bin/python3 /opt/svc/svc.py
          Restart=always
          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable --now svc.service

  # VPC Flow Logs 전달 역할(수강생이 Flow Logs를 켤 때 "기존 역할"로 사용)
  FlowLogsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StudentId}-net-flowlogs-role"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/opslab-student-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: vpc-flow-logs.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogGroups, logs:DescribeLogStreams]
                Resource: "*"

Outputs:
  NetVpcId:
    Value: !Ref NetVpc
    Export: { Name: !Sub "${StudentId}-net-VpcId" }
  NetTgwSubnet:
    Value: !Ref TgwSubnet
    Export: { Name: !Sub "${StudentId}-net-TgwSubnet" }
  NetFwSubnet:
    Value: !Ref FwSubnet
    Export: { Name: !Sub "${StudentId}-net-FwSubnet" }
  NetSvcSubnet:
    Value: !Ref SvcSubnet
    Export: { Name: !Sub "${StudentId}-net-SvcSubnet" }
  NetTgwRt:
    Value: !Ref TgwRt
    Export: { Name: !Sub "${StudentId}-net-TgwRt" }
  NetFwRt:
    Value: !Ref FwRt
    Export: { Name: !Sub "${StudentId}-net-FwRt" }
  NetSvcRt:
    Value: !Ref SvcRt
    Export: { Name: !Sub "${StudentId}-net-SvcRt" }
  SvcId:
    Value: !Ref Svc
  SvcIp:
    Value: 10.20.2.10
  FlowLogsRoleArn:
    Value: !GetAtt FlowLogsRole.Arn
