AWSTemplateFormatVersion: "2010-09-09"
# [net 모듈 완료 상태] 수강생이 1단계에서 CLI로 직접 구축하는 것의 정상 상태(재발 방지 설정 포함):
# Transit Gateway·연결 2개·라우팅, STS 인터페이스 엔드포인트, 서비스 서브넷 NACL, Network Firewall(규칙·정책·로그),
# VPC Flow Logs, NAT 포트 할당 오류 알람. 따라잡기·모듈 시험용(common/start.sh net full). 스택 이름: <학번>-net-done.
Description: >-
  opslab net - done state stack <SID>-net-done (catch-up and module test only): Transit Gateway and routes, STS endpoint, NACL, Network Firewall, Flow Logs, NAT alarm.

Parameters:
  StudentId:
    Type: String
    AllowedPattern: "s[0-9]{2}"

Resources:
  # ── Transit Gateway: 두 VPC를 잇는 중앙 라우터
  Tgw:
    Type: AWS::EC2::TransitGateway
    Properties:
      Description: opslab net
      DefaultRouteTableAssociation: enable
      DefaultRouteTablePropagation: enable
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-tgw" }]
  AttBase:
    Type: AWS::EC2::TransitGatewayAttachment
    Properties:
      TransitGatewayId: !Ref Tgw
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-base-VpcId" }
      SubnetIds: !Split [",", { "Fn::ImportValue": !Sub "${StudentId}-base-AppSubnets" }]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-tgw-att-base" }]
  AttNet:
    Type: AWS::EC2::TransitGatewayAttachment
    Properties:
      TransitGatewayId: !Ref Tgw
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-net-VpcId" }
      SubnetIds: [{ "Fn::ImportValue": !Sub "${StudentId}-net-TgwSubnet" }]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-tgw-att-net" }]
  BaseToNet:   # 기반 VPC 앱 서브넷 → 사내 서비스 VPC
    Type: AWS::EC2::Route
    DependsOn: AttBase
    Properties:
      RouteTableId: { "Fn::ImportValue": !Sub "${StudentId}-base-AppRt" }
      DestinationCidrBlock: 10.20.0.0/16
      TransitGatewayId: !Ref Tgw

  # ── Network Firewall: TGW와 서비스 서브넷 사이에 끼운 검사 지점
  FwRules:
    Type: AWS::NetworkFirewall::RuleGroup
    Properties:
      RuleGroupName: !Sub "${StudentId}-net-fw-rules"
      Type: STATEFUL
      Capacity: 100
      RuleGroup:
        RulesSource:
          StatefulRules:
            - Action: PASS
              Header: { Protocol: TCP, Source: 10.0.0.0/16, SourcePort: ANY, Direction: FORWARD, Destination: 10.20.2.0/24, DestinationPort: "8080" }
              RuleOptions: [{ Keyword: "sid", Settings: ["1"] }]
            - Action: DROP
              Header: { Protocol: IP, Source: ANY, SourcePort: ANY, Direction: ANY, Destination: ANY, DestinationPort: ANY }
              RuleOptions: [{ Keyword: "sid", Settings: ["2"] }]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-fw-rules" }]
  FwPolicy:
    Type: AWS::NetworkFirewall::FirewallPolicy
    Properties:
      FirewallPolicyName: !Sub "${StudentId}-net-fw-policy"
      FirewallPolicy:
        StatelessDefaultActions: ["aws:forward_to_sfe"]
        StatelessFragmentDefaultActions: ["aws:forward_to_sfe"]
        StatefulRuleGroupReferences: [{ ResourceArn: !Ref FwRules }]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-fw-policy" }]
  Fw:
    Type: AWS::NetworkFirewall::Firewall
    Properties:
      FirewallName: !Sub "${StudentId}-net-fw"
      FirewallPolicyArn: !Ref FwPolicy
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-net-VpcId" }
      SubnetMappings: [{ SubnetId: { "Fn::ImportValue": !Sub "${StudentId}-net-FwSubnet" } }]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-fw" }]
  FwAlertLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/opslab/${StudentId}/net-fw"
      RetentionInDays: 1
  FwLogging:
    Type: AWS::NetworkFirewall::LoggingConfiguration
    Properties:
      FirewallArn: !Ref Fw
      LoggingConfiguration:
        LogDestinationConfigs:
          - { LogType: ALERT, LogDestinationType: CloudWatchLogs, LogDestination: { logGroup: !Ref FwAlertLogs } }

  # 사내 서비스 VPC 라우팅: TGW → 방화벽 → 서비스, 서비스 → 방화벽 → TGW
  TgwToSvc:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: { "Fn::ImportValue": !Sub "${StudentId}-net-TgwRt" }
      DestinationCidrBlock: 10.20.2.0/24
      VpcEndpointId: !Select [1, !Split [":", !Select [0, !GetAtt Fw.EndpointIds]]]
  SvcToBase:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: { "Fn::ImportValue": !Sub "${StudentId}-net-SvcRt" }
      DestinationCidrBlock: 10.0.0.0/16
      VpcEndpointId: !Select [1, !Split [":", !Select [0, !GetAtt Fw.EndpointIds]]]
  FwToBase:
    Type: AWS::EC2::Route
    DependsOn: AttNet
    Properties:
      RouteTableId: { "Fn::ImportValue": !Sub "${StudentId}-net-FwRt" }
      DestinationCidrBlock: 10.0.0.0/16
      TransitGatewayId: !Ref Tgw

  # ── PrivateLink: 인터넷 없이 STS를 부르는 인터페이스 엔드포인트
  StsVpceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${StudentId}-net-vpce-sts-sg"
      GroupDescription: STS endpoint - 443 from net VPC
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-net-VpcId" }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 10.20.0.0/16 }
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-vpce-sts-sg" }]
  StsVpce:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-net-VpcId" }
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sts"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [{ "Fn::ImportValue": !Sub "${StudentId}-net-SvcSubnet" }]
      SecurityGroupIds: [!Ref StsVpceSg]
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-vpce-sts" }]

  # ── 서비스 서브넷 NACL (상태 비저장: 요청과 응답을 양방향으로 허용해야 한다)
  SvcNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-net-VpcId" }
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-svc-nacl" }]
  NaclIn100:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref SvcNacl, RuleNumber: 100, Egress: false, RuleAction: allow, Protocol: 6, CidrBlock: 10.0.0.0/16, PortRange: { From: 8080, To: 8080 } }
  NaclIn200:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref SvcNacl, RuleNumber: 200, Egress: false, RuleAction: allow, Protocol: -1, CidrBlock: 10.20.0.0/16 }
  NaclOut100:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref SvcNacl, RuleNumber: 100, Egress: true, RuleAction: allow, Protocol: 6, CidrBlock: 10.0.0.0/16, PortRange: { From: 1024, To: 65535 } }
  NaclOut200:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref SvcNacl, RuleNumber: 200, Egress: true, RuleAction: allow, Protocol: -1, CidrBlock: 10.20.0.0/16 }
  SvcNaclAssoc:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      NetworkAclId: !Ref SvcNacl
      SubnetId: { "Fn::ImportValue": !Sub "${StudentId}-net-SvcSubnet" }

  # ── 관찰 도구: VPC Flow Logs(두 VPC) — 거부(REJECT)된 패킷과 NAT 연결 출처를 본다
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/opslab/${StudentId}/net-flowlogs"
      RetentionInDays: 1
  FlowBase:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: { "Fn::ImportValue": !Sub "${StudentId}-base-VpcId" }
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${StudentId}-net-flowlogs-role"
      MaxAggregationInterval: 60
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-flow-base" }]
  FlowNet:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: { "Fn::ImportValue": !Sub "${StudentId}-net-VpcId" }
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${StudentId}-net-flowlogs-role"
      MaxAggregationInterval: 60
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-net-flow-net" }]

  # ── 재발 방지: NAT 포트 할당 오류 알람
  NatPortAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StudentId}-net-nat-port-alloc"
      Namespace: AWS/NATGateway
      MetricName: ErrorPortAllocation
      Dimensions: [{ Name: NatGatewayId, Value: { "Fn::ImportValue": !Sub "${StudentId}-base-NatId" } }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  TgwId:
    Value: !Ref Tgw
  FwArn:
    Value: !Ref Fw
