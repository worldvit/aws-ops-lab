AWSTemplateFormatVersion: "2010-09-09"
Description: >
  [따라잡기] Day 1 구축 완료 상태를 만든다. cfn/day1-base.yaml 스택이 먼저 있어야 한다.
  따라하기 1단계에서 CLI로 만드는 리소스와 이름·설정이 같다.
  (보안 그룹, 시작 템플릿, 타깃 그룹, ALB, 리스너, Auto Scaling 그룹, 대상 추적 정책)

Parameters:
  StudentId:
    Type: String
    AllowedPattern: "s[0-9]{2}"
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${StudentId}-d1-alb-sg"
      GroupDescription: ALB - HTTP from internet
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-d1-VpcId" }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-alb-sg" }]

  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${StudentId}-d1-app-sg"
      GroupDescription: App - 8080 from ALB only
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-d1-VpcId" }
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSg }
      Tags: [{ Key: Name, Value: !Sub "${StudentId}-d1-app-sg" }]

  Lt:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${StudentId}-d1-lt"
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: t3.micro
        IamInstanceProfile: { Name: { "Fn::ImportValue": !Sub "${StudentId}-d1-Ec2Profile" } }
        SecurityGroupIds: [!Ref AppSg]
        MetadataOptions: { HttpTokens: required }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub "${StudentId}-d1-app" }
              - { Key: Course, Value: opslab }
              - { Key: Day, Value: "1" }
              - { Key: Owner, Value: !Ref StudentId }
        UserData:
          Fn::Base64: |
            #!/bin/bash
            curl -fsSL https://raw.githubusercontent.com/worldvit/aws-ops-lab/main/app/install.sh | bash

  Tg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${StudentId}-d1-tg"
      Protocol: HTTP
      Port: 8080
      TargetType: instance
      VpcId: { "Fn::ImportValue": !Sub "${StudentId}-d1-VpcId" }
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${StudentId}-d1-alb"
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSg]
      Subnets: !Split [",", { "Fn::ImportValue": !Sub "${StudentId}-d1-PublicSubnets" }]

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref Tg }]

  Asg:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: Listener
    Properties:
      AutoScalingGroupName: !Sub "${StudentId}-d1-asg"
      MinSize: "2"
      MaxSize: "4"
      DesiredCapacity: "2"
      LaunchTemplate:
        LaunchTemplateId: !Ref Lt
        Version: !GetAtt Lt.LatestVersionNumber
      VPCZoneIdentifier: !Split [",", { "Fn::ImportValue": !Sub "${StudentId}-d1-AppSubnets" }]
      TargetGroupARNs: [!Ref Tg]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 180
      Tags:
        - { Key: Name, Value: !Sub "${StudentId}-d1-app", PropagateAtLaunch: true }

  ReqPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref Asg
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        TargetValue: 1000
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join ["/", [!GetAtt Alb.LoadBalancerFullName, !GetAtt Tg.TargetGroupFullName]]

Outputs:
  AlbDns:
    Value: !GetAtt Alb.DNSName
